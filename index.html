              ${noteBadge ? `<div class="mt-1.5">${noteBadge}</div>` : ''}
            </div>
            <div>
              <span class="font-bold text-slate-400 block mb-0.5 text-[11px]">取締項目</span>
              <p class="text-slate-700 leading-relaxed bg-slate-50 p-2 rounded-lg border border-slate-100">${item.violation}</p>
            </div>
            <div class="flex items-center justify-between text-[11px] text-slate-400 font-mono pt-1 border-t border-slate-100">
              <span>GPS: ${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</span>
            </div>
            <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" class="mt-2 block w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-center transition-colors shadow-sm">
              🗺️ 開啟 Google 地圖導航
            </a>
          </div>
        </div>
      `;
    }

    function renderMarkers(items) {
      markersCluster.clearLayers();
      markerMap.clear();

      items.forEach(item => {
        const isSpeed = item.note && item.note.includes('超速');
        const marker = L.marker([item.lat, item.lng], {
          icon: createMarkerIcon(isSpeed),
          title: item.location
        });

        marker.bindPopup(buildPopupHtml(item));
        marker.on('click', () => {
          highlightCard(item.id);
        });

        markersCluster.addLayer(marker);
        markerMap.set(item.id, marker);
      });
    }

    function renderList(items) {
      filteredCountEl.textContent = items.length;
      mobileBadgeCountEl.textContent = items.length;
      itemsListEl.innerHTML = '';

      if (items.length === 0) {
        itemsListEl.innerHTML = `
          <div class="text-center py-12 px-4 text-slate-400 space-y-2">
            <svg class="w-8 h-8 mx-auto text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-sm font-medium text-slate-600">無符合條件的路口點位</p>
            <p class="text-xs text-slate-400">請嘗試更換行政區或縮短關鍵字</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const isSpeed = item.note && item.note.includes('超速');
        const card = document.createElement('div');
        card.id = `card-${item.id}`;
        card.className = 'group p-3 bg-white hover:bg-blue-50/50 border border-slate-200 hover:border-blue-400 rounded-xl cursor-pointer transition-all duration-200 shadow-sm hover:shadow';

        let badgeTag = '';
        if (item.note) {
          if (isSpeed) {
            badgeTag = `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">⚡ 取締超速</span>`;
          } else {
            badgeTag = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">ℹ️ ${item.note}</span>`;
          }
        }

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-mono font-bold bg-slate-100 group-hover:bg-blue-100 text-slate-600 group-hover:text-blue-700 px-1.5 py-0.5 rounded">#${item.id}</span>
              <h4 class="font-bold text-xs text-slate-900 leading-snug group-hover:text-blue-600 transition-colors">${item.location}</h4>
            </div>
            <span class="text-[11px] font-medium px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-100 shrink-0">🧭 ${item.direction}</span>
          </div>
          <p class="text-[11px] text-slate-500 line-clamp-2 leading-relaxed mb-2">${item.violation}</p>
          <div class="flex items-center justify-between pt-1.5 border-t border-slate-100">
            <span class="text-[10px] font-mono text-slate-400">${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}</span>
            ${badgeTag}
          </div>
        `;

        card.addEventListener('click', () => {
          selectAndFocusItem(item);
        });

        itemsListEl.appendChild(card);
      });
    }

    function selectAndFocusItem(item) {
      highlightCard(item.id);
      const marker = markerMap.get(item.id);

      if (marker) {
        markersCluster.zoomToShowLayer(marker, () => {
          marker.openPopup();
        });
      }

      // 若在行動端，收合側邊抽屜以呈現地圖
      if (window.innerWidth < 768) {
        sidebarEl.classList.add('translate-y-full');
        mobileToggleBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
          <span>展開清單 (${filteredCountEl.textContent})</span>
        `;
      }
    }

    function highlightCard(id) {
      document.querySelectorAll('#items-list > div').forEach(c => {
        c.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50', 'border-transparent');
      });
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('ring-2', 'ring-blue-500', 'bg-blue-50', 'border-transparent');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function applyFilters() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedDistrict = districtFilter.value;
      const selectedFeature = featureFilter.value;

      const filtered = enforcementData.filter(item => {
        // 行政區過濾
        if (selectedDistrict !== 'ALL' && item.district !== selectedDistrict) {
          return false;
        }

        // 功能特徵過濾
        if (selectedFeature === 'SPEED') {
          if (!item.note || !item.note.includes('超速')) return false;
        } else if (selectedFeature === 'NAME_CHANGE') {
          if (!item.note || !item.note.includes('變更路名')) return false;
        }

        // 關鍵字搜尋
        if (keyword) {
          const matchLoc = item.location.toLowerCase().includes(keyword);
          const matchVio = item.violation.toLowerCase().includes(keyword);
          const matchDir = item.direction.toLowerCase().includes(keyword);
          const matchNote = item.note.toLowerCase().includes(keyword);
          const matchId = String(item.id) === keyword;
          if (!matchLoc && !matchVio && !matchDir && !matchNote && !matchId) {
            return false;
          }
        }

        return true;
      });

      renderMarkers(filtered);
      renderList(filtered);
    }

    searchInput.addEventListener('input', applyFilters);
    districtFilter.addEventListener('change', applyFilters);
    featureFilter.addEventListener('change', applyFilters);

    // 手機端抽屜切換
    mobileToggleBtn.addEventListener('click', () => {
      const isClosed = sidebarEl.classList.contains('translate-y-full');
      if (isClosed) {
        sidebarEl.classList.remove('translate-y-full');
        mobileToggleBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          <span>收合地圖</span>
        `;
      } else {
        sidebarEl.classList.add('translate-y-full');
        mobileToggleBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
          <span>展開清單 (${filteredCountEl.textContent})</span>
        `;
      }
    });

    // 初始渲染執行
    renderMarkers(enforcementData);
    renderList(enforcementData);
  </script>
</body>
</html>
